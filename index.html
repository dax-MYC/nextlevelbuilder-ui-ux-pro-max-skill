<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MyConsult KPI Tracker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app">

    <!-- ── Persistent header ──────────────────────────────────── -->
    <header class="header">
      <div class="header-inner">
        <div class="logo-mark"></div>
        <div class="header-text">
          <h1 class="brand">MyConsult</h1>
          <p class="brand-sub">Weekly KPI Tracker</p>
        </div>
        <!-- Shown only on the form screen -->
        <div id="user-pill" class="user-pill hidden">
          <span id="user-pill-avatar" class="user-pill-avatar"></span>
          <div class="user-pill-info">
            <span id="user-pill-name" class="user-pill-name"></span>
            <span class="user-pill-dept">MyConsult Staff</span>
          </div>
          <button id="change-user-btn" class="change-user-btn" aria-label="Change user">&times;</button>
        </div>
      </div>
    </header>

    <!-- ══════════════════════════════════════════════════════════
         Screen 1 — Staff selection
    ══════════════════════════════════════════════════════════ -->
    <div id="screen-select" class="screen">
      <main class="main select-main">
        <div class="card">
          <h2 class="section-title">Who are you?</h2>
          <p class="section-meta" id="welcome-week"></p>

          <div class="field" id="name-field">
            <label class="label" for="select-name">Your Name</label>
            <div class="select-wrap">
              <select id="select-name">
                <option value="" disabled selected>Select your name</option>
              </select>
            </div>
          </div>

          <div id="select-error" class="form-error hidden"></div>

          <button type="button" id="continue-btn" class="btn-primary">
            Let&rsquo;s go &rarr;
          </button>
        </div>
      </main>
    </div>

    <!-- ══════════════════════════════════════════════════════════
         Screen 2 — KPI form & submission log
    ══════════════════════════════════════════════════════════ -->
    <div id="screen-form" class="screen hidden">
      <main class="main">

        <section class="card">
          <h2 class="section-title">Submit This Week&rsquo;s Actuals</h2>
          <p class="section-meta" id="week-label"></p>

          <form id="kpi-form" novalidate>

            <div class="field">
              <label class="label" for="kpi-name">KPI</label>
              <div class="select-wrap">
                <select id="kpi-name" required>
                  <option value="" disabled selected>Select a KPI</option>
                </select>
              </div>
            </div>

            <div class="field">
              <div class="label-row">
                <label class="label" for="kpi-actual">Actual Value</label>
                <span id="target-chip" class="target-chip hidden"></span>
              </div>
              <input type="number" id="kpi-actual" class="input"
                     placeholder="Enter value" min="0" step="any" required />
            </div>

            <div class="field">
              <label class="label" for="kpi-notes">
                Notes <span class="optional">(optional)</span>
              </label>
              <textarea id="kpi-notes" class="input textarea"
                        placeholder="Any context or blockers…" rows="3"></textarea>
            </div>

            <div id="form-error" class="form-error hidden"></div>

            <button type="submit" class="btn-primary">Submit KPI</button>
          </form>
        </section>

        <!-- Toast notification -->
        <div id="toast" class="toast hidden">
          <span class="toast-icon">&#10003;</span>
          <span id="toast-msg">KPI submitted!</span>
        </div>

        <!-- Submissions log -->
        <section class="card">
          <div class="log-header">
            <h2 class="section-title">Submissions This Week</h2>
            <button id="clear-btn" class="btn-ghost">Clear all</button>
          </div>
          <div id="log-list">
            <p class="empty-state">No submissions yet.</p>
          </div>
        </section>

      </main>
    </div>

    <footer class="footer">
      &copy; <span id="year"></span> MyConsult &mdash; Data stored locally on this device.
    </footer>

  </div>
  <script src="app.js"></script>
</body>
</html>
